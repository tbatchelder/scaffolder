name: Project Automation

on:
  issues:
    types: [opened, labeled, unlabeled, closed]
  pull_request:
    types: [closed]

jobs:
  update-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run project automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: '3'
          ORGANIZATION: 'tbatchelder'
        run: |
          node .github/scripts/update-project.js '${{ toJson(github.event) }}'
